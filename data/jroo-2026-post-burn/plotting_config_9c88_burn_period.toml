MOVING_AVERAGE_WINDOW_SIZE_MIN = 10 # Minutes

LOG_Y_NAMES = ["airQualityMetrics"]

[PLOTTING_CONFIG.INTERVAL_BOUNDS] # Seconds
deviceMetrics = [30, 1000]
environmentMetrics = [50, 250]
powerMetrics = [270, 800]

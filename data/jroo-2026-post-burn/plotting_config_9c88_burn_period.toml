########################################################
#  Sensor Configuration
########################################################

[SENSOR_CONFIG]
BASE_HEADERS = ["datetime", "fromNode"]
NETWORK_HEADERS = []

[SENSOR_CONFIG.SENSOR_HEADERS]
airQualityMetrics = []
deviceMetrics = []
environmentMetrics = []
powerMetrics = []
            
########################################################
# IO Configuration
########################################################

[IO_CONFIG]
DATAFOLDERPATH = "data/jroo-2026-post-burn/"
LOGGER = "9c88"
START_DATETIME = "2026-01-23 09:00:00"
END_DATETIME = "2026-02-08 01:00:00"

########################################################
# Plotting Configuration
########################################################

[PLOTTING_CONFIG]
PLOTFOLDERPATH = "plots/jroo-2026-post-burn/"
